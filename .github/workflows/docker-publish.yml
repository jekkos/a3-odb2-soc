name: Build and Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from config.json
        id: version
        run: |
          VERSION=$(cat config.json | grep '"version"' | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/armhf,linux/armv7,linux/aarch64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/a3-odbd2-soc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/a3-odbd2-soc:${{ steps.version.outputs.version }}
